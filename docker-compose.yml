networks:
  public:
    driver: bridge
    name: litellm_public

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.72.6-stable
    container_name: litellm-proxy
    restart: on-failure:5
    ports:
      - "4000:4000"
    volumes:
      - ./config/litellm/config.yml:/app/config.yml:ro
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_PROXY_PORT: "4000"
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command:
      - "--config"
      - "/app/config.yml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "1"
      - "--telemetry"
      - "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'
