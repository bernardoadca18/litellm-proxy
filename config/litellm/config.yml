# ============================================================
# ROUTER SETTINGS - ESTRATÉGIA DE FALLBACK
# ============================================================
router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  request_timeout: 90
  cooldown_time: 30
  allowed_fails: 2
  enable_loadbalancing: true
  
  # Fallbacks hierárquicos
  fallbacks: [
    # Gemini 3.5 Flash -> outros Gemini -> Groq -> OpenRouter
    {"gemini-3.5-flash": [
      "gemini-3.1-flash-lite",
      "gemini-2.5-flash",
      "gemini-2.0-flash",
      "groq-llama4-scout",
      "groq-llama3.3-70b",
      "openrouter-nemotron-ultra",
      "openrouter-gpt-oss-120b"
    ]},
    
    # Gemini 3.1 Pro -> Gemini 3.5 Flash -> Groq
    {"gemini-3.1-pro": [
      "gemini-3.5-flash",
      "gemini-2.5-pro",
      "groq-llama4-scout",
      "groq-gpt-oss-120b",
      "openrouter-nemotron-super"
    ]},
    
    # Gemini 3.1 Flash-Lite -> Gemini 2.5 Flash-Lite -> Groq
    {"gemini-3.1-flash-lite": [
      "gemini-2.5-flash-lite",
      "gemini-2.0-flash-lite",
      "groq-llama3.1-8b",
      "openrouter-gemma4-26b"
    ]},
    
    # Gemini 2.5 Pro -> Gemini 3.1 Pro -> Groq
    {"gemini-2.5-pro": [
      "gemini-3.1-pro",
      "groq-gpt-oss-120b",
      "openrouter-nemotron-ultra"
    ]},
    
    # Gemini 2.5 Flash -> Gemini 3.5 Flash -> Groq
    {"gemini-2.5-flash": [
      "gemini-3.5-flash",
      "groq-llama4-scout",
      "openrouter-gpt-oss-120b"
    ]},
    
    # Gemini 2.5 Flash-Lite -> Gemini 3.1 Flash-Lite
    {"gemini-2.5-flash-lite": [
      "gemini-3.1-flash-lite",
      "groq-llama3.1-8b"
    ]},
    
    # Gemini 2.0 Flash -> Gemini 2.5 Flash
    {"gemini-2.0-flash": [
      "gemini-2.5-flash",
      "groq-qwen3-32b"
    ]},
    
    # Gemini 2.0 Flash-Lite -> Gemini 2.5 Flash-Lite
    {"gemini-2.0-flash-lite": [
      "gemini-2.5-flash-lite",
      "groq-qwen3.6-27b"
    ]},
    
    # Fallback GROQ -> OpenRouter
    {"groq-llama4-scout": [
      "groq-llama3.3-70b",
      "groq-gpt-oss-120b",
      "openrouter-nemotron-ultra"
    ]},
    
    {"groq-llama3.3-70b": [
      "groq-qwen3-32b",
      "openrouter-gpt-oss-120b"
    ]},
    
    {"groq-gpt-oss-120b": [
      "groq-gpt-oss-20b",
      "openrouter-gpt-oss-120b"
    ]},
    
    # Fallback OpenRouter (último recurso)
    {"openrouter-nemotron-ultra": [
      "openrouter-nemotron-super",
      "openrouter-gpt-oss-120b",
      "openrouter-gemma4-31b"
    ]},
    
    {"openrouter-gpt-oss-120b": [
      "openrouter-gpt-oss-20b",
      "openrouter-gemma4-31b"
    ]}
  ]


# ============================================================
# GENERAL SETTINGS
# ============================================================
litellm_settings:
  num_retries: 3
  request_timeout: 90
  allowed_fails: 3
  cache: true
  cache_params:
    type: redis
    ttl: 3600
    host: redis
    port: 6379
    password: "os.environ/REDIS_PASSWORD"

general_settings:
  log_level: INFO
  max_parallel_requests: 100
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  proxy_batch_write_at: 60
  disable_prerun: false
  enable_jwt_auth: false
  enable_otel: false
  prometheus_endpoint: "/metrics"
  enable_prometheus: true