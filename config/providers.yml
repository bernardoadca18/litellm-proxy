# =============================================================================
# Declarative provider configuration for LiteLLM Proxy
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for providers, models, and metadata.
# API keys are discovered automatically from .env by prefix.
#
# To add a new API key: add it to .env
#   GEMINI_API_KEY_12=<secret>
#
# Then run: make up
# =============================================================================

providers:
  gemini:
    key_prefix: GEMINI_API_KEY_
    models:
      - name: gemini-3.6-flash
        model: gemini/gemini-3.6-flash
        mode: chat
        rpm: 15
        tpm: 3000000
        timeout: 60
        supports_function_calling: true
      - name: gemini-3.1-pro
        model: gemini/gemini-3.1-pro-preview
        mode: chat
        rpm: 5
        tpm: 5000000
        timeout: 90
        supports_function_calling: true
      - name: gemini-3.5-flash-lite
        model: gemini/gemini-3.5-flash-lite
        mode: chat
        rpm: 15
        tpm: 10000000
        timeout: 45
        supports_function_calling: true

  openrouter:
    key_prefix: OPENROUTER_API_KEY_
    models:
      - name: openrouter-embed-vl
        model: openrouter/nvidia/llama-nemotron-embed-vl-1b-v2
        mode: embedding
        rpm: 20
        timeout: 30
      - name: openrouter-gemma4-26b
        model: openrouter/google/gemma-4-26b-a4b
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-gemma4-31b
        model: openrouter/google/gemma-4-31b
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-gpt-oss-120b
        model: openrouter/openai/gpt-oss-120b
        mode: chat
        rpm: 20
        timeout: 90
      - name: openrouter-gpt-oss-20b
        model: openrouter/openai/gpt-oss-20b
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-laguna-m1
        model: openrouter/poolside/laguna-m.1
        mode: chat
        rpm: 20
        timeout: 120
      - name: openrouter-laguna-xs2
        model: openrouter/poolside/laguna-xs.2
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-nemotron-12b-vl
        model: openrouter/nvidia/nemotron-nano-12b-2-vl
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-nemotron-nano-30b
        model: openrouter/nvidia/nemotron-3-nano-30b-a3b
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-nemotron-nano-9b
        model: openrouter/nvidia/nemotron-nano-9b-v2
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-nemotron-omni
        model: openrouter/nvidia/nemotron-3-nano-omni
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-nemotron-super
        model: openrouter/nvidia/nemotron-3-super
        mode: chat
        rpm: 20
        timeout: 90
      - name: openrouter-nemotron-ultra
        model: openrouter/nvidia/nemotron-3-ultra
        mode: chat
        rpm: 20
        timeout: 120
      - name: openrouter-north-mini-code
        model: openrouter/cohere/north-mini-code
        mode: chat
        rpm: 20
        timeout: 60
      - name: openrouter-owl-alpha
        model: openrouter/openrouter/owl-alpha
        mode: chat
        rpm: 20
        timeout: 90
      - name: openrouter-seedream-4.5
        model: openrouter/bytedance-seed/seedream-4.5
        mode: chat
        rpm: 10
        timeout: 120

  groq:
    key_prefix: GROQ_API_KEY_
    models:
      - name: groq-gpt-oss-120b
        model: groq/openai/gpt-oss-120b
        mode: chat
        rpm: 30
        tpm: 8000
        timeout: 90
      - name: groq-gpt-oss-20b
        model: groq/openai/gpt-oss-20b
        mode: chat
        rpm: 30
        tpm: 8000
        timeout: 60
      - name: groq-llama3.1-8b
        model: groq/llama-3.1-8b-instant
        mode: chat
        rpm: 30
        tpm: 6000
        timeout: 30
      - name: groq-llama3.3-70b
        model: groq/llama-3.3-70b-versatile
        mode: chat
        rpm: 30
        tpm: 12000
        timeout: 90
      - name: groq-llama4-scout
        model: groq/meta-llama/llama-4-scout-17b-16e-instruct
        mode: chat
        rpm: 30
        tpm: 30000
        timeout: 60
      - name: groq-qwen3-32b
        model: groq/qwen/qwen3-32b
        mode: chat
        rpm: 30
        tpm: 6000
        timeout: 60
      - name: groq-qwen3.6-27b
        model: groq/qwen/qwen3.6-27b
        mode: chat
        rpm: 30
        tpm: 8000
        timeout: 60

# -----------------------------------------------------------------------------
# Ollama - local models, no key pooling
# -----------------------------------------------------------------------------
ollama:
  models:
    - name: llama3.2-local
      model: ollama/llama3.2
      mode: chat
      api_base: "os.environ/OLLAMA_API_BASE"
      timeout: 120
      info:
        id: "ollama/llama3.2"
        max_tokens: 8192
        max_input_tokens: 131072
        input_cost_per_token: 0.0
        output_cost_per_token: 0.0
    - name: qwen-local
      model: ollama/qwen3.5:9b
      mode: chat
      api_base: "os.environ/OLLAMA_API_BASE"
      timeout: 120
    - name: gemma-local
      model: ollama/gemma4:e4b
      mode: chat
      api_base: "os.environ/OLLAMA_API_BASE"
      timeout: 120
    - name: phi4-mini-local
      model: ollama/phi4-mini
      mode: chat
      api_base: "os.environ/OLLAMA_API_BASE"
      timeout: 120
    - name: ollama-embed
      model: ollama/mxbai-embed-large
      mode: embedding
      api_base: "os.environ/OLLAMA_API_BASE"
    - name: qwen3.5-abliterated-local
      model: ollama_chat/huihui_ai/qwen3.5-abliterated:9b
      mode: chat
      api_base: "os.environ/OLLAMA_API_BASE"

# -----------------------------------------------------------------------------
# Router settings
# -----------------------------------------------------------------------------
router:
  routing_strategy: simple-shuffle
  num_retries: 2
  request_timeout: 90
  cooldown_time: 60
  allowed_fails: 2
  retry_after: 5
  enable_loadbalancing: true

# -----------------------------------------------------------------------------
# General settings
# -----------------------------------------------------------------------------
settings:
  log_level: WARNING
  max_parallel_requests: 100
  request_timeout: 90
  num_retries: 2
  allowed_fails: 2
