events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=litellm_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=litellm_conn:10m;

    upstream litellm_backend {
        server litellm:4000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Redirect to HTTPS (uncomment when SSL is configured)
        # return 301 https://$server_name$request_uri;
        
        location / {
            limit_req zone=litellm_limit burst=20 nodelay;
            limit_conn litellm_conn 100;
            
            proxy_pass http://litellm_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            
            proxy_buffering off;
            proxy_cache off;
            
            # Health check endpoint
            location /health {
                proxy_pass http://litellm_backend/health;
                access_log off;
            }
            
            # Metrics endpoint
            location /metrics {
                proxy_pass http://litellm_backend/metrics;
                access_log off;
            }
        }
    }
}