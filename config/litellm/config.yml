# ============================================================
# GENERAL SETTINGS
# ============================================================
litellm_settings:
  num_retries: 2
  request_timeout: 90
  allowed_fails: 2
  # Cache desabilitado por padrão - prompts diversos não se beneficiam
  # Para ativar, configure via variável de ambiente LITELLM_CACHE_ENABLED=true
  cache: false

general_settings:
  log_level: WARNING
  max_parallel_requests: 100
  master_key: "os.environ/LITELLM_MASTER_KEY"
  # Database URL opcional - apenas para modo com persistência
  # database_url: "os.environ/DATABASE_URL"
  disable_prerun: true
  enable_jwt_auth: false
  enable_otel: false
  prometheus_endpoint: "/metrics"
  enable_prometheus: true