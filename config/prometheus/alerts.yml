groups:
  - name: litellm_alerts
    interval: 30s
    rules:
      - alert: LiteLLMProxyDown
        expr: up{job="litellm"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LiteLLM Proxy is offline"
          description: "The LiteLLM proxy has not responded for more than 1 minute"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(litellm_requests_total{status="error"}[5m]))
            /
            sum(rate(litellm_requests_total[5m]))
          ) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on LiteLLM"
          description: "More than 10% of requests are failing ({{ $value | humanizePercentage }})"

      - alert: RedisDown
        expr: up{job="redis-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Redis is offline"
          description: "Redis cache is not responding (optional service)"

      - alert: PostgresDown
        expr: up{job="postgres-exporter"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL is offline"
          description: "PostgreSQL database is not responding (optional service)"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90% for 5 minutes"

      - alert: LiteLLMHighMemory
        expr: container_memory_usage_bytes{name="litellm-proxy"} / 1024 / 1024 > 800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LiteLLM container using high memory"
          description: "LiteLLM is using {{ $value | humanize }}MB of memory"

      - alert: MultipleAPIFailures
        expr: sum by (model) (rate(litellm_api_failures_total[10m])) > 5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Multiple API failures"
          description: "More than 5 API failures in the last 10 minutes for model {{ $labels.model }}"
