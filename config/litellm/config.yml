# ============================================================
# ROUTER SETTINGS
# ============================================================
router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  request_timeout: 90
  cooldown_time: 10
  allowed_fails: 2
  enable_loadbalancing: true
  
  # Fallback entre grupos
  fallbacks: [
    {"gemini-flash": ["gemini-flash-lite", "gemini-fallback-flash"]},
    {"gemini-pro": ["gemini-flash", "gemini-fallback-pro"]},
    {"gemini-flash-lite": ["gemini-fallback-flash"]}
  ]

# ============================================================
# GENERAL SETTINGS
# ============================================================
litellm_settings:
  num_retries: 2
  request_timeout: 60
  allowed_fails: 2
  cache: false
  cache_params:
    type: redis
    ttl: 3600

general_settings:
  log_level: DEBUG
  max_parallel_requests: 100