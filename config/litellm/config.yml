# ============================================================
# ROUTER SETTINGS - ESTRATÉGIA DE ROTEAMENTO
# ============================================================
# simple-shuffle: distribuição uniforme entre deployments saudáveis
# Cooldown automático para deployments com falhas
# Fallback para próxima credencial disponível no mesmo model group
router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  request_timeout: 90
  cooldown_time: 60
  allowed_fails: 2
  retry_after: 5
  enable_loadbalancing: true
  
