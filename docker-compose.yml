networks:
  public:
    driver: bridge
    name: litellm_public
  private:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  redis-data:
    labels:
      description: "Redis cache storage for LiteLLM"
  postgres-data:
    labels:
      description: "PostgreSQL database for LiteLLM (optional)"
  prometheus-data:
    labels:
      description: "Prometheus metrics storage"
  grafana-data:
    labels:
      description: "Grafana dashboards"

services:
  # ============================================================
  # CORE SERVICES (default profile)
  # ============================================================
  
  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly no
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
      --maxclients 200
      --timeout 300
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - private
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles:
      - cache
      - multiworker
    deploy:
      resources:
        limits:
          memory: 64M

  litellm:
    image: ghcr.io/berriai/litellm:v1.72.6-stable
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "4000:4000"   # API
      - "4001:4001"   # Metrics
    volumes:
      - ./config/litellm/config.yml:/app/config.yml:ro
    env_file:
      - .env
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_LOG_LEVEL: ${LITELLM_LOG_LEVEL:-WARNING}
      LITELLM_PROXY_PORT: "4000"
      LITELLM_METRICS_PORT: "4001"
      OLLAMA_API_BASE: ${OLLAMA_API_BASE:-http://host.docker.internal:11434}
    command:
      - "--config"
      - "/app/config.yml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "${LITELLM_NUM_WORKERS:-1}"
      - "--telemetry"
      - "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - public
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  nginx:
    image: nginx:1.28-alpine
    container_name: litellm-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - litellm
    networks:
      - public
      - monitoring
    profiles:
      - with-nginx
    deploy:
      resources:
        limits:
          memory: 64M

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: litellm-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - monitoring
      - public
    depends_on:
      - litellm
    deploy:
      resources:
        limits:
          memory: 256M

  grafana:
    image: grafana/grafana:11.4.0
    container_name: litellm-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: http://localhost:3000
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "3000:3000"
    networks:
      - monitoring
      - private
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 256M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.51.0
    container_name: litellm-cadvisor
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      - private
      - monitoring
    privileged: true
    deploy:
      resources:
        limits:
          memory: 128M

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: litellm-node-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    networks:
      - monitoring
      - private
    deploy:
      resources:
        limits:
          memory: 64M

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: litellm-redis-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "9121"
    networks:
      - private
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: litellm-postgres-exporter
    restart: unless-stopped
    profiles:
      - monitoring
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    expose:
      - "9187"
    networks:
      - private
      - monitoring
    deploy:
      resources:
        limits:
          memory: 64M

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.26.0
    container_name: litellm-blackbox
    restart: unless-stopped
    profiles:
      - monitoring
    expose:
      - "9115"
    networks:
      - monitoring
      - public
    deploy:
      resources:
        limits:
          memory: 64M

  watchtower:
    image: containrrr/watchtower:latest
    container_name: litellm-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_CLEANUP: "true"
      WATCHTOWER_POLL_INTERVAL: 86400
    command: --label-enable
    profiles:
      - auto-update
    deploy:
      resources:
        limits:
          memory: 64M

  # ============================================================
  # OPTIONAL DATABASE (for persistence, teams, budgets)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: litellm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=64MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-litellm} -d ${POSTGRES_DB:-litellm}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - database
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M